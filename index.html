*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:light;
  --bg:#014b4a;--text:#d4e8d8;
  --text-dim:rgba(212,232,216,0.48);--text-faint:rgba(212,232,216,0.22);
  --border:rgba(46,139,87,0.15);--card:rgba(10,16,12,0.96);
  --green:#2e8b57;--gl:#5fb88a;
  --red:#ff6b55;--yellow:#ffd84a;--gnote:#4ed87a;--blue:#5ab4ff;
}
html{scroll-behavior:smooth}
html,body{background:#014b4a!important;}
body{color:var(--text);
  font-family:'Observer Cover','Futura','Century Gothic','Trebuchet MS',sans-serif;
  min-height:100vh;padding:40px 16px 64px;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:none;}
.frame{display:none}
.wrap{position:relative;max-width:940px;margin:0 auto}

.header{text-align:center;margin-bottom:28px;}
.eyebrow{font-size:9px;letter-spacing:7px;text-transform:uppercase;color:rgba(46,139,87,0.45);margin-bottom:12px;display:block;}
h1{font-family:'Observer Cover','Futura','Century Gothic','Trebuchet MS',sans-serif;font-size:clamp(22px,4vw,36px);font-weight:300;color:#e8f5ec;margin-bottom:6px;letter-spacing:1px;}
.sub{font-size:13px;color:var(--text-faint);letter-spacing:2px;}
.rule{display:none}

/* Legend */
.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
.legend-item{display:flex;align-items:center;gap:8px;background:transparent;
  border:none;border-radius:0;padding:5px 12px;font-family:'Raleway','Space Mono',monospace;font-size:9px;letter-spacing:0.08em;color:rgba(212,232,216,0.75);}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.legend-sub{font-size:9px;color:rgba(212,232,216,0.45);margin-top:1px;font-family:'Raleway','Space Mono',monospace;}

/* Cycle/toggle buttons */
.cycle-wrap{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
.cycle-btn{
  background:#fff;border:2px solid #111;color:#111;
  padding:7px 18px;border-radius:4px;
  font-family:'Raleway','Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700;
  cursor:pointer;transition:all 0.2s;
}
.cycle-btn:hover{background:#acc6a1;border-color:#111;color:#111;}
.cycle-btn.active{background:#2e8b57;border-color:#2e8b57;color:#fff;}

/* Detail panel */
.detail-panel{
  background:#fff;border:2px solid #111;border-radius:8px;
  padding:14px 20px;margin-bottom:16px;
  height:62px;min-height:62px;max-height:62px;
  display:flex;align-items:center;gap:18px;flex-wrap:nowrap;
  overflow:hidden;transition:border-color 0.3s;box-sizing:border-box;
}
.detail-note{font-size:30px;font-weight:400;line-height:1;min-width:52px;color:#111;}
.detail-name{font-family:'Raleway','Space Mono',monospace;font-size:11px;margin-bottom:3px;color:#111;}
.detail-meta{font-family:'Raleway','Space Mono',monospace;font-size:9px;color:#555;letter-spacing:0.06em;}
.detail-badge{font-family:'Raleway','Space Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;
  padding:3px 10px;border-radius:2px;white-space:nowrap;}
.detail-empty{font-family:'Raleway','Space Mono',monospace;font-size:11px;color:#999;letter-spacing:0.06em;}

/* Staff sections */
.staff-section{
  background:#fff;border:2px solid #111;border-radius:8px;
  padding:18px 14px 14px;margin-bottom:14px;overflow-x:auto;
}
.staff-header{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.staff-header-label{font-family:'Raleway','Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#2e8b57;font-weight:700;}
.staff-header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.clef-label{font-family:'Raleway','Space Mono',monospace;font-size:8px;letter-spacing:0.08em;color:#555;}

/* Dropdown selects */
.instrument-select{
  background:#fff;
  border:2px solid #111;color:#111;
  padding:5px 28px 5px 10px;border-radius:4px;
  font-family:'Raleway','Space Mono',monospace;font-size:9px;letter-spacing:0.1em;
  cursor:pointer;outline:none;transition:border-color 0.2s,color 0.2s;

</style>
</head>
<body>
<div class="frame"></div>
<div class="wrap">

  
<div class="logo-wrap"><a href="/" aria-label="Home" style="display:inline-block;text-decoration:none" title="Home"><div class="macro-graphic" id="macroGraphic" aria-label="Macro - animated interference graphic"></div></a></div>
<div class="header">
    <h1>Macrotonal Ear Trainer</h1>
    <div class="rule"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>
      <div><div>Red</div><div class="legend-sub">No adjustment</div></div></div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>

    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>
      <div><div>Green</div><div class="legend-sub">−50¢ flat</div></div></div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>
      <div><div>Blue</div><div class="legend-sub">−25¢ flat</div></div></div>
  </div>

  <div class="cycle-wrap" style="margin-bottom:14px;">

    <button class="cycle-btn active" id="btnScore" onclick="setNoteMode('score')">Score · Middle C = C4</button>
  </div>

  <!-- Playback mode -->
  <div class="cycle-wrap" style="margin-bottom:14px;">
    <button class="cycle-btn active" id="modeSingle"   onclick="setMode('single')">Single</button>
    <button class="cycle-btn"        id="modeSustain"  onclick="setMode('sustain')">Sustain</button>
    <button class="cycle-btn"        id="modePulse"    onclick="setMode('pulse')">Pulse</button>
    <button class="cycle-btn"        id="modeInterval" onclick="setMode('interval')" style="border-color:rgba(74,158,104,0.35);">+ Root interval</button>

  <div class="detail-panel" id="detailPanel">

  <!-- Upper staff -->
  <div class="staff-section">

      <div class="staff-header-controls">

          <optgroup label="────────────────"></optgroup>

          <option value="ottava" selected>Ottava</option>
          <option value="8va">8va</option>
          <option value="15ma">15ma</option>

<script>
const BASE = 261.63
const CS   = 125
const STD  = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']
const DIAT = {C:0,D:1,E:2,F:3,G:4,A:5,B:6}
const DNAMES = ['Unison','Macro 2nd','Macro 3rd','Neutral 3rd','Pure 4th','Wide Tritone',
                'Macro 6th','Near Maj. 6th','Pure Min. 7th','Wide Maj. 7th','Macro 9th','Macro 10th']
const COLS = [
  {name:'Red',    hex:'#e85840', bg:'rgba(232,88,64,0.12)',   border:'rgba(232,88,64,0.4)',   adj:'No adjustment'},
  {name:'Yellow', hex:'#d4a000', bg:'rgba(212,160,0,0.12)',   border:'rgba(212,160,0,0.4)',   adj:'+25¢ sharp'},
  {name:'Green',  hex:'#30b85e', bg:'rgba(48,184,94,0.12)',   border:'rgba(48,184,94,0.4)',   adj:'−50¢ flat'},
  {name:'Blue',   hex:'#3aa0e8', bg:'rgba(58,160,232,0.12)',  border:'rgba(58,160,232,0.4)',  adj:'−25¢ flat'},
]
const hz = c => BASE * Math.pow(2, c / 1200)

// ── Instrument definitions ─────────────────────────────────────
const INSTRUMENTS = {
  treble:       { clef:'treble', transposeSteps:0,  transposeName:'' },
  bass:         { clef:'bass',   transposeSteps:0,  transposeName:'' },
  soprano_sax:  { clef:'treble', transposeSteps:2,  transposeName:'Written pitch is a Major 2nd higher than concert' },
  alto_sax:     { clef:'treble', transposeSteps:7,  transposeName:'Written pitch is a Major 6th higher than concert' },
  bari_sax:     { clef:'treble', transposeSteps:17, transposeName:'Written pitch is an octave + Major 6th higher than concert' },
  clarinet:     { clef:'treble', transposeSteps:2,  transposeName:'Written pitch is a Major 2nd higher than concert' },
  bass_clarinet:{ clef:'bass',   transposeSteps:11, transposeName:'Written pitch is an octave + Major 2nd higher than concert' },
}

function makeNote(step) {
  const cents = step * CS
  const std   = Math.round(step * 125 / 100)
  const idx   = ((std % 12) + 12) % 12
  const name  = STD[idx]
  const aoct  = 3 + Math.floor(std / 12)
  const deg   = ((step % 12) + 12) % 12
  const base  = name.replace('#','')
  return {
    step, cents, freq: hz(cents),
    noteName: name, abletonOct: aoct,
    displayOct: () => noteMode === 'score' ? aoct + 1 : aoct,
    deg, degreeNum: deg + 1, degreeName: DNAMES[deg],
    col: COLS[deg % 4],
    diatPos: DIAT[base] + (aoct - 3) * 7,
    isSharp: name.includes('#'),
  }
}

const range = (start, len=12) => Array.from({length:len}, (_,i) => makeNote(start+i))

// ── Audio ─────────────────────────────────────────────────────
let ctx=null, oscs=[], active=null, pulseTimer=null
let playMode = 'single'
let intervalMode = false

const ac = () => {
  if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)()
  if(ctx.state==='suspended') ctx.resume()
  return ctx
}

function setMode(m) {
  if (m === 'interval') {
    intervalMode = !intervalMode
    document.getElementById('modeInterval').classList.toggle('active', intervalMode)
    return
  }
  playMode = m
  ;['single','sustain','pulse'].forEach(id => {
    document.getElementById('mode'+id.charAt(0).toUpperCase()+id.slice(1)).classList.toggle('active', id===m)
  })
  killAll()
  showIdleHint()
}

function getIdleHint() {
  if (playMode === 'sustain') return 'Click a note - it will sustain until you click another'
  if (playMode === 'pulse')   return 'Click a note - it will pulse repeatedly'
  return 'Click any note to hear it'
}

function showIdleHint() {
  if (active !== null) return
  const dp = document.getElementById('detailPanel')
  dp.style.borderColor = ''
  dp.innerHTML = `<div class="detail-empty">${getIdleHint()}</div>`
}

// Wire hover hints on playback mode buttons - runs after DOM is ready
function wireHoverHints() {
  const hints = {
    modeSingle:   'Click any note to hear it',
    modeSustain:  'Click a note - it will sustain until you click another',
    modePulse:    'Click a note - it will pulse repeatedly',
    modeInterval: 'Click any note to hear it against the root',
  }
  Object.keys(hints).forEach(id => {
    const btn = document.getElementById(id)
    if (!btn) return
    btn.addEventListener('mouseenter', () => {
      if (active !== null) return
      const dp = document.getElementById('detailPanel')
      dp.style.borderColor = ''
      dp.innerHTML = `<div class="detail-empty">${hints[id]}</div>`
    })
    btn.addEventListener('mouseleave', showIdleHint)
  })
}

function killAll(fadeTime = 0.05) {
  if (pulseTimer) { clearTimeout(pulseTimer); pulseTimer = null }
  if (ctx) {
    const now = ctx.currentTime
    oscs.forEach(o => {
      try {
        if (o._gain) {
          o._gain.gain.cancelScheduledValues(now)
          o._gain.gain.setValueAtTime(o._gain.gain.value, now)
          o._gain.gain.linearRampToValueAtTime(0, now + fadeTime)
        }
        o.stop(now + fadeTime + 0.02)
      } catch(e) {}
    })
  }
  oscs = []
  if(active!==null) {
    document.querySelectorAll(`[data-step="${active}"]`).forEach(e=>e.classList.remove('playing'))
    active=null
  }
}

function mkOsc(cents, startT, dur, vol=0.2, fade=0.06) {
  const c=ac(), o=c.createOscillator(), g=c.createGain()
  o.type='sine'; o.frequency.value=hz(cents)
  g.gain.setValueAtTime(0, startT)
  g.gain.linearRampToValueAtTime(vol, startT + fade)
  g.gain.setValueAtTime(vol, startT + dur - 0.08)
  g.gain.linearRampToValueAtTime(0, startT + dur)
  o.connect(g); g.connect(c.destination)
  o.start(startT); o.stop(startT + dur + 0.06)
  o._gain = g
  oscs.push(o)
  return o
}

function schedulePulse(n, iteration=0) {
  const ON = 2.5, OFF = 2.0
  if (active !== n.step) return
  const offset = iteration === 0 ? 0.07 : 0
  const t = ac().currentTime + offset
  mkOsc(n.cents, t, ON, 0.2, 0.05)
  if (intervalMode) mkOsc(0, t, ON, 0.14, 0.05)
  pulseTimer = setTimeout(() => schedulePulse(n, iteration+1), (ON + OFF) * 1000)
}

function playNote(n) {
  killAll()
  active = n.step
  document.querySelectorAll(`[data-step="${n.step}"]`).forEach(e=>e.classList.add('playing'))

  // Start slightly after killAll's fade to ensure no overlap click
  const FADE = 0.05
  const t = ac().currentTime + FADE + 0.01

  if (playMode === 'single') {
    mkOsc(n.cents, t, 2.6, 0.2)
    if (intervalMode) mkOsc(0, t, 2.6, 0.14)
    setTimeout(()=>{
      document.querySelectorAll(`[data-step="${n.step}"]`).forEach(e=>e.classList.remove('playing'))
      if(active===n.step) { active=null; showIdleHint() }
    }, (FADE + 0.01 + 2.6) * 1000 + 200)

  } else if (playMode === 'sustain') {
    const c = ac()
    const osc = c.createOscillator()
    const gain = c.createGain()
    osc.type = 'sine'; osc.frequency.value = hz(n.cents)
    gain.gain.setValueAtTime(0, t)
    gain.gain.linearRampToValueAtTime(0.2, t + 0.06)
    osc.connect(gain); gain.connect(c.destination)
    osc.start(t)
    osc._gain = gain
    oscs.push(osc)
    if (intervalMode) {
      const o2 = c.createOscillator(), g2 = c.createGain()
      o2.type='sine'; o2.frequency.value=hz(0)
      g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(0.13,t+0.06)
      o2.connect(g2); g2.connect(c.destination); o2.start(t)
      o2._gain = g2
      oscs.push(o2)
    }

  } else if (playMode === 'pulse') {
    schedulePulse(n)
  }

  const col = n.col
  const dp = document.getElementById('detailPanel')
  dp.style.borderColor = col.border
  const modeLabel = playMode === 'single' ? '' : playMode === 'sustain' ? ' · sustaining' : ' · pulsing'
  const intervalLabel = intervalMode ? ' · +root' : ''
  dp.innerHTML = `
    <div class="detail-note" style="color:${col.hex}">${n.noteName}${n.displayOct()}</div>
    <div style="flex:1">
      <div class="detail-name" style="color:${col.hex}">${n.degreeName} · Degree ${n.degreeNum}</div>
      <div class="detail-meta">${n.freq.toFixed(2)} Hz · ${n.cents}¢ from root · ${col.adj}${modeLabel}${intervalLabel}</div>
    </div>
    <div class="detail-badge" style="background:${col.bg};border:1px solid ${col.border};color:${col.hex}">${col.name}</div>
  `
}

function playScale() {
  killAll()
  const btn=document.getElementById('playAllBtn')
  btn.textContent='Playing…'; btn.disabled=true
  const all=[...range(cur*12-12), ...range(cur*12)]
  const t=ac().currentTime
  all.forEach((n,i) => mkOsc(n.cents, t+i*0.52, 0.48, 0.2, 0.03))
  setTimeout(()=>{ btn.textContent='▶ Play both staves ascending'; btn.disabled=false }, all.length*520+400)
}

// ── Staff drawing ─────────────────────────────────────────────
const LS=10, NR=6, ML=50, MR=14
const STOP=52, SBOT=STOP+4*LS
const SVGH_BASE=SBOT+62

function sy(clef, dp) {
  if (clef==='treble') return SBOT - (dp - 2) * (LS/2)
  return SBOT - (dp + 10) * (LS/2)
}

function calcSvgHeight(clef, notes, transposeSteps) {
  // Find the highest note (lowest y value) to ensure it fits
  let minY = SVGH_BASE
  notes.forEach(n => {
    const writtenStep = n.step + transposeSteps
    const writtenRaw = makeNote(writtenStep)
    const y = sy(clef, writtenRaw.diatPos)
    if (y < minY) minY = y
  })
  // Add padding above the highest note (for stem + label)
  const topPad = 50
  const extra = minY < STOP ? STOP - minY + topPad : 0
  return SVGH_BASE + extra
}

// Fixed SVG height - compact now that ottava markings handle high/low notes
// Just enough room for bracket label above and below the staff
const SVGH_FIXED = SVGH_BASE + 40

// Diatonic steps per octave
const DIAT_1OCT = 7
const DIAT_2OCT = 14
const DIAT_3OCT = 21

// Thresholds - how far outside the staff before ottava kicks in
// One line beyond the staff edge in either direction
const OTTAVA_THRESHOLD_HIGH = STOP - LS   // above: raw y must be < this
const OTTAVA_THRESHOLD_LOW  = SBOT + LS   // below: raw y must be > this

// Given a raw y and a mode, return { shift (diatonic steps, signed: +ve = down), label, dir }
// dir: 'above' | 'below' | null
function getOttava(yRaw, ottavaMode) {
  if (ottavaMode === 'off') return { shift: 0, label: null, dir: null }

  const aboveModes = ['ottava', '8va', '15ma', '22ma']
  const belowModes = ['ottava', '8vb', '15mb']

  // ── ABOVE STAFF ──
  if (yRaw < OTTAVA_THRESHOLD_HIGH) {
    if (!aboveModes.includes(ottavaMode)) return { shift: 0, label: null, dir: null }

    if (ottavaMode === '8va') return { shift: DIAT_1OCT, label: '8va', dir: 'above' }
    if (ottavaMode === '15ma') return { shift: DIAT_2OCT, label: '15ma', dir: 'above' }
    if (ottavaMode === '22ma') return { shift: DIAT_3OCT, label: '22ma', dir: 'above' }

    // 'ottava' - adaptive: pick the smallest shift that brings note within staff
    const after1 = yRaw + DIAT_1OCT * (LS / 2)
    const after2 = yRaw + DIAT_2OCT * (LS / 2)
    if (after1 >= OTTAVA_THRESHOLD_HIGH) return { shift: DIAT_1OCT, label: '8va',  dir: 'above' }
    if (after2 >= OTTAVA_THRESHOLD_HIGH) return { shift: DIAT_2OCT, label: '15ma', dir: 'above' }
    return { shift: DIAT_3OCT, label: '22ma', dir: 'above' }
  }

  // ── BELOW STAFF ──
  if (yRaw > OTTAVA_THRESHOLD_LOW) {
    if (!belowModes.includes(ottavaMode)) return { shift: 0, label: null, dir: null }

    if (ottavaMode === '8vb')  return { shift: -DIAT_1OCT, label: '8vb',  dir: 'below' }
    if (ottavaMode === '15mb') return { shift: -DIAT_2OCT, label: '15mb', dir: 'below' }

    // 'ottava' - adaptive below
    const after1 = yRaw - DIAT_1OCT * (LS / 2)
    const after2 = yRaw - DIAT_2OCT * (LS / 2)
    if (after1 <= OTTAVA_THRESHOLD_LOW) return { shift: -DIAT_1OCT, label: '8vb',  dir: 'below' }
    if (after2 <= OTTAVA_THRESHOLD_LOW) return { shift: -DIAT_2OCT, label: '15mb', dir: 'below' }
    return { shift: -DIAT_3OCT, label: '22mb', dir: 'below' }
  }

  return { shift: 0, label: null, dir: null }
}

function draw(svgId, instrumentKey, startStep, ottavaMode = 'ottava') {
  const svg = document.getElementById(svgId)
  svg.innerHTML = ''
  const ns = 'http://www.w3.org/2000/svg'
  const mk = (tag,attrs,txt) => {
    const e = document.createElementNS(ns,tag)
    Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v))
    if(txt !== undefined) e.textContent = txt
    return e
  }

  const inst = INSTRUMENTS[instrumentKey]
  const clef = inst.clef
  const transposeSteps = inst.transposeSteps

  const concertNotes = range(startStep)

  // When ottava is Off, expand height dynamically to fit all ledger lines in both directions
  let SVGH
  if (ottavaMode === 'off') {
    let minY = SVGH_BASE, maxY = 0
    concertNotes.forEach(n => {
      const writtenStep = n.step + transposeSteps
      const writtenRaw  = makeNote(writtenStep)
      const y = sy(clef, writtenRaw.diatPos)
      if (y < minY) minY = y
      if (y > maxY) maxY = y
    })
    const extraTop    = minY < STOP ? STOP - minY + 50 : 0
    const extraBottom = maxY > SBOT ? maxY - SBOT + 30 : 0
    SVGH = SVGH_BASE + extraTop + extraBottom
  } else {
    SVGH = SVGH_FIXED
  }

  const cw = svg.parentElement.clientWidth - 28
  const sp = Math.max(42, Math.min(60, (cw - ML - MR) / concertNotes.length))
  const W  = Math.max(cw, ML + concertNotes.length * sp + MR)
  svg.setAttribute('viewBox', `0 0 ${W} ${SVGH}`)
  svg.setAttribute('width', W)
  svg.setAttribute('height', SVGH)

  // vOff = small fixed push-down so ottava label has room above staff
  const vOff = SVGH - SVGH_BASE
  const stopOff = STOP + vOff
  const sbotOff = SBOT + vOff

  for(let i=0;i<5;i++)
    svg.appendChild(mk('line',{x1:ML-6,y1:stopOff+i*LS,x2:W-MR,y2:stopOff+i*LS,stroke:'rgba(17,17,17,0.7)','stroke-width':'0.8'}))

  svg.appendChild(mk('text',{x:6,y:clef==='treble'?stopOff+30:stopOff+22,'font-size':clef==='treble'?'52':'36',fill:'rgba(17,17,17,0.75)','font-family':'serif'},clef==='treble'?'𝄞':'𝄢'))

  // First pass: compute ottava info per note so we can draw brackets after
  const noteData = concertNotes.map((n, i) => {
    const x = ML + i * sp + sp / 2
    const writtenStep = n.step + transposeSteps
    const writtenRaw  = makeNote(writtenStep)
    const diatPos     = writtenRaw.diatPos
    const yRaw        = sy(clef, diatPos)          // un-offset y
    const ottava      = getOttava(yRaw, ottavaMode)
    const displayDiat = diatPos - ottava.shift      // subtract to move note down on staff
    const y           = sy(clef, displayDiat) + vOff
    return { n, i, x, writtenRaw, yRaw, ottava, displayDiat, y }
  })

  // ── Draw ottava brackets (dashed line + label + terminal tick) ──
  // Group consecutive notes sharing the same ottava label
  const ottavaGroups = []
  let gStart = null
  noteData.forEach((d, idx) => {
    if (d.ottava.label) {
      const key = d.ottava.label
      if (!gStart || gStart.label !== key) {
        if (gStart) ottavaGroups.push(gStart)
        gStart = { label: key, dir: d.ottava.dir, indices: [idx] }
      } else {
        gStart.indices.push(idx)
      }
    } else {
      if (gStart) { ottavaGroups.push(gStart); gStart = null }
    }
  })
  if (gStart) ottavaGroups.push(gStart)

  ottavaGroups.forEach(grp => {
    const first = noteData[grp.indices[0]]
    const last  = noteData[grp.indices[grp.indices.length - 1]]
    const isAbove = grp.dir === 'above'
    const bracketY = isAbove
      ? stopOff - 14          // just above top staff line
      : sbotOff + 14          // just below bottom staff line
    const x1 = first.x - sp * 0.3
    const x2 = last.x  + sp * 0.3
    const tickDir = isAbove ? 1 : -1   // tick points toward staff

    // Dashed horizontal line
    svg.appendChild(mk('line',{
      x1, y1: bracketY, x2, y2: bracketY,
      stroke:'rgba(17,17,17,0.4)', 'stroke-width':'0.8',
      'stroke-dasharray':'3,2'
    }))
    // Terminal tick (points toward the staff)
    svg.appendChild(mk('line',{
      x1:x2, y1:bracketY, x2:x2, y2:bracketY + tickDir * 5,
      stroke:'rgba(17,17,17,0.4)', 'stroke-width':'0.8'
    }))
    // Label
    svg.appendChild(mk('text',{
      x: x1 - 1,
      y: isAbove ? bracketY - 3 : bracketY + 9,
      'font-size':'8', 'font-style':'italic',
      fill:'rgba(17,17,17,0.5)', 'font-family':"Observer Cover, Futura, Century Gothic, sans-serif"
    }, grp.label))
  })

  // ── Draw notes ──────────────────────────────────────────────────
  noteData.forEach(({ n, x, writtenRaw, ottava, y }) => {
    const col        = n.col
    const isSharp    = writtenRaw.isSharp
    const writtenName = writtenRaw.noteName
    const writtenOct  = noteMode === 'score' ? writtenRaw.abletonOct + 1 : writtenRaw.abletonOct

    // Ledger lines below staff
    for(let ly = sbotOff + LS; ly <= y + 1; ly += LS)
      svg.appendChild(mk('line',{x1:x-NR-3,y1:ly,x2:x+NR+3,y2:ly,stroke:'rgba(17,17,17,0.6)','stroke-width':'0.8'}))
    // Ledger lines above staff (only within normal range now)
    for(let ly = stopOff - LS; ly >= y - 1; ly -= LS)
      svg.appendChild(mk('line',{x1:x-NR-3,y1:ly,x2:x+NR+3,y2:ly,stroke:'rgba(17,17,17,0.6)','stroke-width':'0.8'}))

    const g = document.createElementNS(ns, 'g')
    g.setAttribute('class', 'note-g')
    g.setAttribute('data-step', n.step)
    g.addEventListener('click', () => playNote(n))

    g.appendChild(mk('ellipse',{cx:x,cy:y,rx:NR,ry:NR*0.72,fill:col.hex}))

    if(isSharp)
      g.appendChild(mk('text',{x:x-NR-6,y:y+4,'font-size':'10',fill:col.hex,'font-family':'serif'},'♯'))

    const up  = y > stopOff + 2 * LS
    const sx2 = up ? x + NR - 1 : x - NR + 1
    g.appendChild(mk('line',{x1:sx2,y1:y,x2:sx2,y2:y+(up?-26:26),stroke:col.hex,'stroke-width':'1.5'}))

    const labelBottom = transposeSteps !== 0
      ? `${writtenName}${writtenOct}`
      : `${n.noteName}${n.displayOct()}`

    g.appendChild(mk('text',{x,y:SVGH-9,'text-anchor':'middle','font-size':'9.5','font-weight':'bold',fill:col.hex,'font-family':"Observer Cover, Futura, Century Gothic, sans-serif"}, labelBottom))
    g.appendChild(mk('text',{x,y:12,'text-anchor':'middle','font-size':'8.5','font-weight':'bold',fill:col.hex,'font-family':"Observer Cover, Futura, Century Gothic, sans-serif"},n.degreeNum+''))

    if(transposeSteps !== 0) {
      g.appendChild(mk('text',{x,y:23,'text-anchor':'middle','font-size':'7.5',fill:col.hex,'font-family':"Observer Cover, Futura, Century Gothic, sans-serif"},`(${n.noteName}${n.displayOct()})`))
    }

    svg.appendChild(g)
  })
}

// ── Instrument change handler ──────────────────────────────────
function onInstrumentChange(which) {
  if (which === 'upper') {
    const inst   = document.getElementById('upperInstrument').value
    const ottava = document.getElementById('upperOttava').value
    updateTransposeNote('upperTransposeNote', inst)
    draw('upperSvg', inst, cur * 12, ottava)
    updateRangeLabel('upperRangeLabel', inst, cur * 12)
  } else {
    const inst   = document.getElementById('lowerInstrument').value
    const ottava = document.getElementById('lowerOttava').value
    updateTransposeNote('lowerTransposeNote', inst)
    draw('lowerSvg', inst, cur * 12 - 12, ottava)
    updateRangeLabel('lowerRangeLabel', inst, cur * 12 - 12)
  }
}

function updateTransposeNote(elId, instrumentKey) {
  const inst = INSTRUMENTS[instrumentKey]
  document.getElementById(elId).textContent = inst.transposeName
}

function updateRangeLabel(elId, instrumentKey, startStep) {
  const inst = INSTRUMENTS[instrumentKey]
  const ts   = inst.transposeSteps
  const cStart = makeNote(startStep)
  const cEnd   = makeNote(startStep + 11)
  const wStart = makeNote(startStep + ts)
  const wEnd   = makeNote(startStep + 11 + ts)

  let label
  if (ts === 0) {
    label = `${cStart.noteName}${cStart.displayOct()} – ${cEnd.noteName}${cEnd.displayOct()}`
  } else {
    const concertRange = `concert ${cStart.noteName}${cStart.displayOct()}–${cEnd.noteName}${cEnd.displayOct()}`
    const writtenRange = `written ${wStart.noteName}${noteMode==='score'?wStart.abletonOct+1:wStart.abletonOct}–${wEnd.noteName}${noteMode==='score'?wEnd.abletonOct+1:wEnd.abletonOct}`
    label = `${concertRange} · ${writtenRange}`
  }
  document.getElementById(elId).textContent = label
}

// ── Cycle selector ────────────────────────────────────────────
// val = cycle offset (0 = the octave containing Middle C in MIDI = C3)
// MIDI: Middle C is C3. Score: Middle C is C4.
// We have cycles from val=-2 up to val=3 (6 total: 1 below original bottom, original 3, 2 above)
const CYCLE_VALS = [-2, -1, 0, 1, 2]

function getCycleLabel(val) {
  // The 'root' octave in MIDI terms is val=0 → C3–B4 (MIDI) / C4–B5 (Score)
  // val=-1 → C1–B2 (MIDI) / C2–B3 (Score)  [lower staff of val=0]
  // Each val step = 12 macrotonal steps = one 'cycle'
  // Upper staff starts at val*12, lower staff at val*12-12
  // We label by the upper staff range since that's the main reference
  const upperStart = makeNote(val * 12)
  const upperEnd   = makeNote(val * 12 + 11)
  const lowerStart = makeNote(val * 12 - 12)
  const lowerEnd   = makeNote(val * 12 - 1)

  const oct = (n) => noteMode === 'score' ? n.abletonOct + 1 : n.abletonOct

  // Middle C is at step=0, which is val=0 upper staff first note
  const isMiddleCOctave = val === 0

  let label
  if (isMiddleCOctave) {
    label = `Middle C – ${upperEnd.noteName}${oct(upperEnd)}`
  } else {
    label = `${upperStart.noteName}${oct(upperStart)} – ${upperEnd.noteName}${oct(upperEnd)}`
  }
  return label
}

let cur = 0
let noteMode = 'score'

function setNoteMode(mode) {
  noteMode = mode
  document.getElementById('btnMidi').classList.toggle('active', mode === 'midi')
  document.getElementById('btnScore').classList.toggle('active', mode === 'score')
  buildButtons()
  redrawAll()
}

function redrawAll() {
  const upperInst   = document.getElementById('upperInstrument').value
  const lowerInst   = document.getElementById('lowerInstrument').value
  const upperOttava = document.getElementById('upperOttava').value
  const lowerOttava = document.getElementById('lowerOttava').value
  draw('upperSvg', upperInst, cur * 12,      upperOttava)
  draw('lowerSvg', lowerInst, cur * 12 - 12, lowerOttava)
  updateRangeLabel('upperRangeLabel', upperInst, cur * 12)
  updateRangeLabel('lowerRangeLabel', lowerInst, cur * 12 - 12)
}

function setCycle(val) {
  cur = val
  document.querySelectorAll('.cycle-btn[data-val]').forEach(b => b.classList.toggle('active', +b.dataset.val === val))
  redrawAll()
  active = null
  showIdleHint()
}

function buildButtons() {
  const w = document.getElementById('cycleWrap')
  w.innerHTML = ''
  CYCLE_VALS.forEach(val => {
    const b = document.createElement('button')
    b.className = 'cycle-btn'
    b.dataset.val = val
    b.textContent = getCycleLabel(val)
    if (val === cur) b.classList.add('active')
    b.onclick = () => setCycle(val)
    w.appendChild(b)
  })
}

buildButtons()
updateTransposeNote('upperTransposeNote', 'treble')
updateTransposeNote('lowerTransposeNote', 'bass')
setCycle(0)
wireHoverHints()
window.addEventListener('resize', redrawAll);

(function(){
  var graphic = document.getElementById('macroGraphic');
  if (!graphic) return;
  function buildLayer(cls) {
    var ns='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(ns,'svg');
    var C=500, ir=108, or_=432, n=60;
    svg.setAttribute('class','macro-lines '+cls);
    svg.setAttribute('viewBox','0 0 1000 1000');
    svg.setAttribute('aria-hidden','true');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    for(var i=0;i<n;i++){
      var a=((i/n)*Math.PI*2)-(Math.PI/2);
      var l=document.createElementNS(ns,'line');
      l.setAttribute('x1',String(C+Math.cos(a)*ir));
      l.setAttribute('y1',String(C+Math.sin(a)*ir));
      l.setAttribute('x2',String(C+Math.cos(a)*or_));
      l.setAttribute('y2',String(C+Math.sin(a)*or_));
      svg.appendChild(l);
    }
    var c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',String(C));c.setAttribute('cy',String(C));c.setAttribute('r','109');
    svg.appendChild(c);
    return svg;
  }
  graphic.appendChild(buildLayer('macro-lines--still'));
  graphic.appendChild(buildLayer('macro-lines--moire'));
  function setI(cx,cy){
    var r=document.body.getBoundingClientRect();
    var x=((cx-r.left)/r.width)-0.5, y=((cy-r.top)/r.height)-0.5;
    graphic.style.setProperty('--moire-x',(x*7).toFixed(2)+'px');
    graphic.style.setProperty('--moire-y',(y*7).toFixed(2)+'px');
    graphic.style.setProperty('--moire-start',(x*0.45).toFixed(3)+'deg');
  }
  document.body.addEventListener('pointermove',function(e){setI(e.clientX,e.clientY);},{passive:true});
})();
</script>
